<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144" width="144" height="144" role="img" aria-label="Expiry Tracker">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1F3B"/>
      <stop offset="1" stop-color="#0B0D1A"/>
    </linearGradient>
    <linearGradient id="ring" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFC233"/>
      <stop offset="0.55" stop-color="#FF6B3D"/>
      <stop offset="1" stop-color="#F43F7A"/>
    </linearGradient>
  </defs>
  <rect width="144" height="144" rx="32" fill="url(#tile)"/>
  <!-- remaining time: faint full ring -->
  <circle cx="72" cy="72" r="42" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="13"/>
  <!-- elapsed time: three quarters of the ring, starting at 12 o'clock -->
  <circle cx="72" cy="72" r="42" fill="none" stroke="url(#ring)" stroke-width="13" stroke-linecap="round"
          stroke-dasharray="197.9 263.9" transform="rotate(-90 72 72)"/>
  <!-- handled in time -->
  <path d="M54 73.5 L67 86 L91 59" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
